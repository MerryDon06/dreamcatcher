services:
  - type: web
    name: dream-catcher
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dream-catcher-db
          property: connectionString

databases:
  - name: dream-catcher-db
    plan: free
    databaseName: dream_catcher
    user: dream_catcher_user
