services:
  - type: web
    name: dream-catcher
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/dreams.db
    disk:
      name: dreams-data
      mountPath: /var/data
      sizeGB: 1
